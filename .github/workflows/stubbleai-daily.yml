name: StubbleAI Daily Prediction

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stubbleai-daily-main
  cancel-in-progress: false

jobs:
  daily-prediction:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect satellite fire data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/v1/update_live_firms_2026.py

      - name: Aggregate district observations
        run: python scripts/v1/live_district_fire_2026.py

      - name: Build live features
        run: python scripts/v1/build_live_2026_features.py

      - name: Update weather data
        run: python scripts/v1/live_weather_2026.py

      - name: Generate predictions
        run: python scripts/v1/predict_2026.py

      - name: Update prediction tracker
        run: python scripts/v1/prediction_tracker.py

      - name: Commit generated live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/live/live_firms_2026_history.csv \
            data/live/live_district_fire_2026.csv \
            data/live/live_2026_fire_features.csv \
            data/live/live_weather_2026.csv \
            data/live/stubbleai_2026_predictions.csv \
            data/live/stubbleai_2026_prediction_history.csv \
            data/live/prediction_tracker.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update StubbleAI daily live predictions"
            git push origin HEAD:main
          else
            echo "No live data changes to commit."
          fi
